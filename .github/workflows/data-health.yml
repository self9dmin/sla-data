name: Data health

# Monthly community-facing data-health check: flags broken SLA links and stale
# vendors, then keeps a single tracking issue up to date so contributors can act.

on:
  schedule:
    - cron: '0 8 1 * *'   # 08:00 UTC on the 1st of each month
  workflow_dispatch:

concurrency:
  group: sla-data-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  data-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: install
        name: Install validation dependency
        continue-on-error: true
        run: npm ci --ignore-scripts
      - id: validate
        name: Validate data structure
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/validate-data.cjs 2>&1 | tee validation-report.md
      - id: check
        name: Run data health check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/data-health.cjs
      - id: remediation
        name: Propose safe URL remediation
        if: steps.install.outcome == 'success' && steps.check.outcome == 'success'
        continue-on-error: true
        run: node scripts/remediate.cjs
      - id: parity
        name: Verify website data mirror parity
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          SITE_VENDORS_URL: https://sla.directory/api/v1/vendors.json
        run: node scripts/check-mirror-parity.cjs
      - name: Open or update tracking issue
        if: always()
        uses: actions/github-script@v9
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          REMEDIATION_OUTCOME: ${{ steps.remediation.outcome }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
          CHECK_COUNT: ${{ steps.check.outputs.count }}
        with:
          script: |
            const fs = require('fs');
            const read = (file, fallback) => fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : fallback;
            const install = process.env.INSTALL_OUTCOME || 'unknown';
            const validate = process.env.VALIDATE_OUTCOME || 'not run';
            const check = process.env.CHECK_OUTCOME || 'not run';
            const remediation = process.env.REMEDIATION_OUTCOME || 'not run';
            const parity = process.env.PARITY_OUTCOME || 'not run';
            const rawCount = process.env.CHECK_COUNT || '';
            const count = rawCount === '' ? null : Number(rawCount);
            const findings = Number.isFinite(count) && count > 0;
            const automationFailed = install !== 'success' || validate !== 'success' ||
              check !== 'success' || remediation !== 'success' || parity !== 'success';
            const title = 'Data health: broken SLA links and stale data';
            const health = read('data-health-report.md', 'Health check report unavailable because the checker did not complete.');
            const validation = read('validation-report.md', 'Structural validation report unavailable because validation did not run.');
            const mirror = read('mirror-parity-report.md', 'Mirror parity report unavailable because the comparison did not run.');
            const remediationReport = read('data-remediation-report.md', 'Remediation report unavailable because the remediation step did not run.');
            const status = [
              `- Dependency install: ${install}`,
              `- Structural validation: ${validate}`,
              `- Health check: ${check}`,
              `- Safe remediation: ${remediation}`,
              `- Website/data mirror parity: ${parity}`,
              `- Health findings: ${Number.isFinite(count) ? count : 'unavailable'}`,
            ].join('\n');
            const fullBody = '# Automation status\n\n' + status + '\n\n' +
              '# Structural validation\n\n' + validation + '\n\n' +
              '# Website/data mirror parity\n\n' + mirror + '\n\n' +
              '# Remediation\n\n' + remediationReport + '\n\n' + health;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'data-health',
            });
            const existing = issues.find((i) => i.title === title);
            if (automationFailed || findings) {
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: fullBody });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: fullBody, labels: ['data-health'] });
              }
            }
            if (!automationFailed && !findings) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: 'All clear: no broken SLA links and nothing past the 12-month freshness window as of this run.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed',
                });
              }
            }
